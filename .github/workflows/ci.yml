name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 17]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, test, Spotless, JaCoCo, license check
        run: ./gradlew build -PtestRuntime=${{ matrix.java }} --no-daemon

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      # Dependency review needs the repository dependency graph, which is a
      # setting only the repo owner can turn on:
      # https://github.com/guptagautam768/agent-eval-harness/settings/security_analysis
      # Until that is enabled the action errors before it can review anything.
      # Remove continue-on-error after the graph is on so real findings fail CI.
      - uses: actions/dependency-review-action@v5
        continue-on-error: true
